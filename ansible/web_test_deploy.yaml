apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-test
  template:
    metadata:
      labels:
        app: web-test
    spec:
      containers:
        - name: web-test
          image: ghcr.io/zaszasxs/web-test:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: web-test-service
spec:
  type: NodePort
  selector:
    app: web-test
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
      nodePort: 30080
