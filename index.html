<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click Challenge 100</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Kanit:wght@300;600&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Login Screen -->
        <div id="login-container" class="container">
            <header>
                <h1>ยินดีต้อนรับ!</h1>
                <p>กรุณาใส่ชื่อของคุณเพื่อเริ่มความท้าทาย</p>
            </header>
            <div class="input-group">
                <input type="text" id="username" placeholder="ชื่อของคุณ..." autocomplete="off">
                <button id="start-btn" class="main-button">เริ่มเล่น!</button>
            </div>
        </div>

        <!-- Main Game Container -->
        <div id="game-container" class="container hidden">
            <header>
                <h1 id="user-greeting">หวัดดี!</h1>
                <div class="timer-wrapper">
                    <span id="timer">00:00.00</span>
                </div>
                <p id="motivate-text">เริ่มได้เลย! ความพยายามอยู่ที่ไหน ความสำเร็จอยู่ที่นั่น</p>
            </header>

            <div class="counter-display">
                <span id="counter">0</span>
                <div class="progress-bar">
                    <div id="progress" style="width: 0%;"></div>
                </div>
            </div>

            <button id="click-btn" class="main-button">คลิก!</button>

            <div id="reward-container" class="hidden">
                <div class="reward-content">
                    <h2 id="final-stats">ยินดีด้วย!</h2>
                    <img src="public/reward_final.png" alt="Reward" id="reward-img">
                    <div class="btn-group">
                        <button id="reset-btn">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
                            เล่นอีกครั้ง
                        </button>
                        <button id="new-player-btn">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                            ผู้เล่นใหม่
                        </button>
                    </div>
                </div>
            </div>

            <!-- Stats Overlay -->
            <div id="stats-container" class="hidden">
                <div class="stats-content">
                    <h2>🏆 สถิติคนว่างงานสูงสุด</h2>
                    <ul id="leaderboard-list">
                        <!-- Scores will be injected here -->
                    </ul>
                    <button id="close-stats-btn">ปิด</button>
                </div>
            </div>
        </div>
    </div>
    <footer id="debug-footer">
        <span id="pod-name-badge">Loading pod info...</span>
    </footer>
    <script type="module" src="main.js"></script>
</body>
</html>
